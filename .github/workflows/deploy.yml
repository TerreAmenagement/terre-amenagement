name: Publication du site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 3 * *"   # le 3 de chaque mois : recalcul des prix DVF
  workflow_dispatch:

# Par défaut, lecture seule ; seul le recalcul des prix peut écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  prix:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3
      - id: dvf
        continue-on-error: true
        run: python scripts/build_dvf.py
      - if: steps.dvf.outcome == 'success'
        name: Enregistrer les nouveaux prix
        run: |
          git config user.name "dvf-bot"
          git config user.email "dvf-bot@users.noreply.github.com"
          git add site/data/prix-dvf.json
          git diff --cached --quiet || git commit -m "Prix DVF : mise à jour"
          git push

  publier:
    needs: prix
    # publie aussi lors d'un push (le travail « prix » est alors ignoré)
    if: always() && (needs.prix.result == 'success' || needs.prix.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=terre-amenagement --branch=main --commit-dirty=true

      # Signale la page d'accueil à Bing (et DuckDuckGo, Yahoo, Ecosia, Qwant, Yandex…) via IndexNow.
      # La clé est publique par conception : elle est publiée à la racine du site.
      - name: Signaler la mise à jour (IndexNow)
        continue-on-error: true
        run: |
          sleep 20
          curl -sS -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{"host":"www.terre-amenagement.fr","key":"56d2d4e90d1a1eae135dc15c0eb87c4f","keyLocation":"https://www.terre-amenagement.fr/56d2d4e90d1a1eae135dc15c0eb87c4f.txt","urlList":["https://www.terre-amenagement.fr/"]}'
