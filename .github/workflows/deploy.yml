name: Publication du site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 3 * *"   # le 3 de chaque mois : recalcul des prix DVF
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event_name != 'push'
        run: pip install pandas==2.2.3
      - if: github.event_name != 'push'
        id: dvf
        continue-on-error: true
        run: python scripts/build_dvf.py
      - if: github.event_name != 'push' && steps.dvf.outcome == 'success'
        name: Enregistrer les nouveaux prix
        run: |
          git config user.name "dvf-bot"
          git config user.email "dvf-bot@users.noreply.github.com"
          git add site/data/prix-dvf.json
          git diff --cached --quiet || git commit -m "Prix DVF : mise à jour"
          git push

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=terre-amenagement --branch=main --commit-dirty=true
